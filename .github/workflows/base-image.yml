name: base image

# Builds docker/Dockerfile and publishes the pipeline's base image,
# ghcr.io/seandavi/curatedmetagenomics:metaphlan<version> (ADR-0017 pattern).
# It is `process.container` in conf/base.config and the container of the
# default MetaPhlAn profile. Pull requests build and smoke-test without
# pushing; pushes to main (and manual runs) publish. The OCI source label links
# the package to this repository so GITHUB_TOKEN can write to it; making the
# package public is a one-time manual step, as for humann4a (#97).
on:
  push:
    branches: [main]
    paths:
      - 'docker/Dockerfile'
      - 'docker/usersettings'
      - '.github/workflows/base-image.yml'
  pull_request:
    paths:
      - 'docker/Dockerfile'
      - 'docker/usersettings'
      - '.github/workflows/base-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: base-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/seandavi/curatedmetagenomics
  # Keep in step with the MetaPhlAn pin in docker/Dockerfile.
  METAPHLAN_VERSION: 4.2.6

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (load locally for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: docker
          load: true
          tags: curatedmetagenomics:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Every tool a process running in the base image calls.
      - name: Smoke test
        run: |
          docker run --rm curatedmetagenomics:ci bash -c '
            set -euo pipefail
            metaphlan --version
            # 4.2.6 reports 4.2.5, so check its one change instead: --input_type
            # mapout without --mapout/--no_map is accepted (4.2.5 rejects it),
            # which is how the pipeline reads the map file back.
            out=$(metaphlan --input_type mapout --index none --db_dir /nonexistent -o /tmp/o.tsv /dev/null 2>&1 || true)
            ! grep -q "Specify with --mapout" <<<"$out"
            python -c "import importlib.resources as r; assert (r.files(\"metaphlan\")/\"utils\"/\"mpa_vJan26_CHOCOPhlAnSGB_202605_SGB2GTDB_r226.tsv\").is_file()"
            sample2markers.py --help >/dev/null
            bowtie2 --version | head -1
            samtools --version | head -1
            minimap2 --version
            kneaddata --version
            kneaddata_database --available >/dev/null
            test -f /installed/Trimmomatic-0.39/trimmomatic-0.39.jar
            java -version 2>&1 | head -1
            fastqc --version
            { seqtk 2>&1 || true; } | grep Version
            fasterq-dump --version | grep fasterq
            aws --version
            pigz --version
            pv --version | head -1
            ps --version
            curl --version | head -1
            ! command -v humann'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          tags: |
            ${{ env.IMAGE }}:metaphlan${{ env.METAPHLAN_VERSION }}
            ${{ env.IMAGE }}:metaphlan${{ env.METAPHLAN_VERSION }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=curatedMetagenomicsNextflow base image (MetaPhlAn ${{ env.METAPHLAN_VERSION }}, KneadData, FastQC, sratoolkit; no HUMAnN)
          cache-from: type=gha
