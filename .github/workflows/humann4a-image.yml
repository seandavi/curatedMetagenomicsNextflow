name: humann4a image

# Builds docker/humann4a and publishes ghcr.io/seandavi/humann:4.0.0a1 (ADR-0017).
# Pull requests build and smoke-test without pushing; pushes to main (and manual
# runs) publish. The OCI source label links the package to this repository so
# GITHUB_TOKEN can write to it; making the package public is a one-time manual
# step (#97).
on:
  push:
    branches: [main]
    paths:
      - 'docker/humann4a/**'
      - '.github/workflows/humann4a-image.yml'
  pull_request:
    paths:
      - 'docker/humann4a/**'
      - '.github/workflows/humann4a-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: humann4a-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/seandavi/humann
  VERSION: 4.0.0a1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (load locally for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: docker/humann4a
          load: true
          tags: humann4a:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm humann4a:ci bash -c '
            set -euo pipefail
            humann --version 2>&1 | grep -q "v4.0.0.alpha.1"
            metaphlan --version
            diamond --version
            bowtie2 --version | head -1
            humann_test
            humann_databases --available'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: docker/humann4a
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ env.VERSION }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=HUMAnN ${{ env.VERSION }} for the curatedMetagenomicsNextflow humann4.0.0a1 bundle
          cache-from: type=gha
